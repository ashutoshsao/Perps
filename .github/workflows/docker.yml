name: Build and push Docker images

on:
  push:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api
            image: ashutoshsao/perps-app-api
          - service: engine
            image: ashutoshsao/perps-app-engine
          - service: wss
            image: ashutoshsao/perps-app-wss
          - service: price-feeder
            image: ashutoshsao/perps-app-price-feeder
          - service: db-poller
            image: ashutoshsao/perps-app-db-poller
          - service: market-maker
            image: ashutoshsao/perps-app-market-maker

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}
